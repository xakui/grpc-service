syntax = "proto3";

package cerence.cloudservices.domain.results.weather.v1;

import "cerence/cloudservices/domain/common/content/weather/v1/ski_conditions.proto";
import "cerence/cloudservices/domain/common/content/weather/v1/weather_overview.proto";
import "cerence/cloudservices/domain/common/content/weather/v1/weather_summary.proto";
import "cerence/cloudservices/domain/common/dialog/v1/dialog_result.proto";

option go_package = "cerence/cloudservices/domain/results/weather/v1";
option java_multiple_files = true;
option java_outer_classname = "WeatherDomainResultsProto";
option java_package = "com.cerence.cloudservices.domain.results.weather.v1";

// The weather summary response
message WeatherSummaryResponse {
  cerence.cloudservices.domain.common.content.weather.v1.WeatherSummary content = 1;

  cerence.cloudservices.domain.common.dialog.v1.PlugAndPlayDialogResult dialog = 2;

  string intent_reference = 3;
}

// The weather overview response
message WeatherOverviewResponse {
  cerence.cloudservices.domain.common.content.weather.v1.WeatherOverview content = 1;

  cerence.cloudservices.domain.common.dialog.v1.PlugAndPlayDialogResult dialog = 2;

  string intent_reference = 3;
}

// The ski conditions response
message SkiConditionsResponse {
  cerence.cloudservices.domain.common.content.weather.v1.SkiConditions content = 1;

  cerence.cloudservices.domain.common.dialog.v1.PlugAndPlayDialogResult dialog = 2;

  string intent_reference = 3;
}
