syntax = "proto3";

package cerence.cloudservices.domain.results.pa.v1;

import "cerence/cloudservices/domain/common/content/pa/v1/personal_assistant_content.proto";
import "cerence/cloudservices/domain/common/dialog/v1/dialog_result.proto";

option go_package = "cerence/cloudservices/domain/results/pa/v1";
option java_multiple_files = true;
option java_outer_classname = "PersonalAssistantDomainResultsProto";
option java_package = "com.cerence.cloudservices.domain.results.pa.v1";

// The personal assistant response
message PersonalAssistantResponse {
  cerence.cloudservices.domain.common.content.pa.v1.PersonalAssistantContent content = 1;

  cerence.cloudservices.domain.common.dialog.v1.PlugAndPlayDialogResult dialog = 2;

  string intent_reference = 3;
}
