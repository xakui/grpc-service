syntax = "proto3";

package cerence.cloudservices.domain.results.dialog.v1;

import "cerence/cloudservices/domain/common/dialog/v1/dialog_result.proto";
import "cerence/cloudservices/domain/common/dialog/v1/dialog_streaming_response_payload.proto";

option go_package = "cerence/cloudservices/domain/results/dialog/v1";
option java_multiple_files = true;
option java_outer_classname = "DialogDomainResultsProto";
option java_package = "com.cerence.cloudservices.domain.results.dialog.v1";

// The plug and play response
message PlugAndPlayDialogResponse {
  cerence.cloudservices.domain.common.dialog.v1.PlugAndPlayDialogResult dialog = 1;

  string intent_reference = 2;
}

// The first streaming chunk for PnP response, 
// if the domain response streaming feature is enabled and the cloud intends to return the PnP response in streaming way.
message PlugAndPlayDialogStreamingResponseStart {

  cerence.cloudservices.domain.common.dialog.v1.PlugAndPlayDialogStreamingResult dialog = 1;

  string intent_reference = 2;
}

// The continuous streaming chunk for PnP response, after the PlugAndPlayDialogStreamingResponseStart,
// if the domain response streaming feature is enabled and the cloud intended to return the PnP response in streaming way.
message PlugAndPlayDialogStreamingResponseContinuation {
  oneof continuation {
    // Interation facet chunk
    cerence.cloudservices.domain.common.dialog.v1.FacetChunk facet_chunk = 1;

    // After all interactions' facet has been sent back to client, then send back the dialog follow up information
    cerence.cloudservices.domain.common.dialog.v1.DialogFollowUp dialog_follow_up = 2;
  }
}

// The self service dialog response
message SelfServiceDialogResponse {
  cerence.cloudservices.domain.common.dialog.v1.SelfServiceDialogResult dialog = 1;

  string intent_reference = 2;
}
