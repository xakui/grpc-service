syntax = "proto3";

package cerence.cloudservices.domain.common.dialog.v1;


import "google/protobuf/struct.proto";

option go_package = "cerence/cloudservices/domain/common/dialog/v1";
option java_multiple_files = true;
option java_package = "com.cerence.cloudservices.domain.common.dialog.v1";
option java_outer_classname = "DialogTaskProto";

message Task {
  // Current state of the given task.
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_ACTIVE = 1;
    STATE_SUSPENDED = 2;
    STATE_FINISHED = 3;
    STATE_ABORTED = 4;
  }

  // The id attribute is a unique identifier for an existing task. It is assigned by the dialog engine.
  string id = 1;

  // NLU intent that activated the task. For possible values (intent types), see NLU semantic spec
  string intent = 2;

  // Literal from the NLU interpretation that initiated the task.
  // Only the part from the whole spoken utterance corresponding to the intent above.
  string literal = 3;

  // Current state of the given task.
  State state = 4;

  // The context object contains task scoped context variables.
  // Variables in the task context are preserved until the task is finished or aborted.
  map<string, google.protobuf.Value> context = 5;

  // An array identifying the current NLU concepts the dialog is trying to collect for the task.
  repeated string concepts_in_focus = 6;
}