syntax = "proto3";

package cerence.cloudservices.domain.common.dialog.v1;


import "google/protobuf/struct.proto";

option go_package = "cerence/cloudservices/domain/common/dialog/v1";
option java_multiple_files = true;
option java_package = "com.cerence.cloudservices.domain.common.dialog.v1";
option java_outer_classname = "InteractionProto";

message Interaction {
  string key = 1;

  // Identifies the task that generated the interaction, or null if it's a top-level interaction.
  string task_id = 2;

  // Object containing the facets for the given interaction. The key is the facet name.
  map<string, Facet> facets = 3;
}

message Facet {
  // The escalation number for the facet.
  uint32 escalation = 1;

  // The variant number for the facet.
  uint32 variant = 2;

  // Value of the facet itself.
  oneof value {
    string string_value = 3;

    bytes bytes_value = 4;

    google.protobuf.Struct struct_value = 5;
  }
}
