syntax = "proto3";

package cerence.cloudservices.domain.common.dialog.v1;

import "cerence/cloudservices/api/dialog/v1/dialog_context.proto";
import "cerence/cloudservices/domain/common/dialog/v1/domain_action.proto";
import "cerence/cloudservices/domain/common/dialog/v1/dialog_configuration.proto";
import "cerence/cloudservices/domain/common/dialog/v1/dialog_interaction.proto";
import "cerence/cloudservices/domain/common/dialog/v1/dialog_query.proto";
import "cerence/cloudservices/domain/common/dialog/v1/dialog_task.proto";
import "cerence/cloudservices/api/common/v1/content_item.proto";

option go_package = "cerence/cloudservices/domain/common/dialog/v1";
option java_multiple_files = true;
option java_package = "com.cerence.cloudservices.domain.common.dialog.v1";
option java_outer_classname = "DialogResultProto";

message PlugAndPlayDialogResult {

  // The responses generated by the app for the current request.
  // The order of the interactions in the array defines the order in which the interactions should be performed on the
  // client.
  repeated cerence.cloudservices.domain.common.dialog.v1.Interaction interactions = 1;

  // Indicates if one of the tasks is in active state.
  // Simple integrations that are only concerned to check if there is an
  // active task to have the mic open for recording may use the Boolean
  // and ignore the tasks[].
  bool has_active_task = 2;

  // Indicates if there is an active chat ongoing.
  bool has_active_chat = 7;

  // When a user intends to exit the dialog, the system's behavior should vary based on the user's attitude.
  // Client might need this information to operate on the HU. (e.g. Close long snoozing etc.)
  ExitType exit_type = 5;

  // Indicates which action was taken for this plug and play result.
  oneof action_type {
    cerence.cloudservices.domain.common.dialog.v1.CerenceDomainAction cerence_domain_action = 3;

    cerence.cloudservices.domain.common.dialog.v1.SelfServiceDomainAction self_service_domain_action = 4;
  }

  // The dialog's follow up picklist content item
  cerence.cloudservices.api.common.v1.ContentItem follow_up_content_item = 6;
}

// If the domain streaming response feature is enabled and a domain supports stream back the response,
// the the dialog result will be a type of PlugAndPlayDialogStreamingResult, to indicate that the domain response
// will be a streaming response.
// PlugAndPlayDialogStreamingResult is still a type of plug and play dialog result but the difference is that its dialog interaction
// will be streamed back to client chunk-by-chunk, but not directly included in the dialog result message.
message PlugAndPlayDialogStreamingResult {

  // Indicates which action was taken for this plug and play result.
  oneof action_type {
    cerence.cloudservices.domain.common.dialog.v1.CerenceDomainAction cerence_domain_action = 1;

    cerence.cloudservices.domain.common.dialog.v1.SelfServiceDomainAction self_service_domain_action = 2;
  }
}

message SelfServiceDialogResult {
  // The configuration holds information about the current dialog object configuration.
  cerence.cloudservices.domain.common.dialog.v1.Configuration configuration = 1;

  // Object that contains session scoped variables and transaction scoped variables that can
  // be exchanged between client and dialog engine
  cerence.cloudservices.api.dialog.v1.DialogContext context = 2;

  // The responses generated by the app for the current request.
  // The order of the interactions in the array defines the order in which the interactions
  // should be performed on the client.
  repeated cerence.cloudservices.domain.common.dialog.v1.Interaction interactions = 3;

  // The tasks attribute is an array containing the current tasks in the session.
  repeated cerence.cloudservices.domain.common.dialog.v1.Task tasks = 4;

  // Indicates if one of the tasks is in active state.
  // Simple integrations that are only concerned to check if there is an
  // active task to have the mic open for recording may use the Boolean
  // and ignore the tasks[].
  bool has_active_task = 5;

  // Indicates that a Self-Service Dialog needs to query data from the client.
  cerence.cloudservices.domain.common.dialog.v1.QueryRequest query_request = 6;
}


// To express how much the user wants to exit a dialog.
enum ExitType {
  EXIT_TYPE_UNSPECIFIED = 0;
  EXIT_TYPE_SOFT_EXIT = 1;
  EXIT_TYPE_HARD_EXIT = 2;
}
