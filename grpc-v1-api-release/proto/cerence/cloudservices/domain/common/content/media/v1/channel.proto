syntax = "proto3";

package cerence.cloudservices.domain.common.content.media.v1;

import "cerence/cloudservices/domain/common/content/media/v1/sirius_xm.proto";
import "cerence/cloudservices/domain/common/content/media/v1/visual_content.proto";
import "cerence/cloudservices/domain/common/content/media/v1/genres.proto";


option go_package = "cerence/cloudservices/domain/common/content/media/v1";
option java_multiple_files = true;
option java_outer_classname = "ChannelProto";
option java_package = "com.cerence.cloudservices.domain.common.content.media.v1";

message Channel{
  ChannelBaseInfo base_info = 1;

  string description = 3;

  repeated Genre genres = 4;

  repeated VisualContent media=5;

  //   Each provider that supports songs will have a metadata section here
  oneof metadata{
    SiriusXMChannelMetadata sirius_xm_metadata = 6;
  }
}

message ChannelBaseInfo{
  string id = 1;

  string name = 2;
}