syntax = "proto3";

package cerence.cloudservices.domain.common.content.media.v1;


import "cerence/cloudservices/domain/common/content/media/v1/media_content.proto";

option java_multiple_files = true;
option java_outer_classname = "MediaContentStatusProto";
option java_package = "com.cerence.cloudservices.domain.common.content.media.v1";
option go_package = "cerence/cloudservices/domain/common/content/media/v1";

//Status for each of the providers supported. Will tell if there was a problem retrieving content and what problem it was
message MediaContentStatus {
  //Provider for which the status is being provided
  Provider provider = 1;

  //Actual Status
  ProviderStatus content_status = 2;

  //Optional additional information about the status that could help with troubleshooting.
  string content_reason = 3;
}

enum ProviderStatus {
  PROVIDER_STATUS_UNSPECIFIED = 0;  
  PROVIDER_STATUS_OK = 1;
  PROVIDER_STATUS_NO_CONTENT = 2;
  PROVIDER_STATUS_TOKEN_INVALID = 3;
  PROVIDER_STATUS_MISSING_TOKEN = 4;
  PROVIDER_STATUS_PROVIDER_INTERNAL_ERROR = 5;
  PROVIDER_STATUS_MEDIA_INTERNAL_ERROR = 6;
}

