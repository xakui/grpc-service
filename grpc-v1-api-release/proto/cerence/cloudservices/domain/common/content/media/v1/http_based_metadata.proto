syntax = "proto3";

package cerence.cloudservices.domain.common.content.media.v1;


option go_package = "cerence/cloudservices/domain/common/content/media/v1";
option java_multiple_files = true;
option java_outer_classname = "HttpMetadataProto";
option java_package = "com.cerence.cloudservices.domain.common.content.media.v1";


message HttpSongMetadata{
  repeated HttpSongContent web_content=1;
}

message HttpSongContent{
  string url=1;

  SongFormat format=2;

  SongType type=3;
}

enum SongFormat{
  SONG_FORMAT_UNSPECIFIED=0;
  SONG_FORMAT_MP4=1;
}

enum SongType{
  SONG_TYPE_UNSPECIFIED=0;
  SONG_TYPE_ORIGINAL_SONG=1;
  SONG_TYPE_WITHOUT_LEAD_VOCALS=2;
}