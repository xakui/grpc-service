syntax = "proto3";

package cerence.cloudservices.domain.common.content.news.v1;


option go_package = "cerence/cloudservices/domain/common/content/news/v1";
option java_multiple_files = true;
option java_outer_classname = "NewsEntityProto";
option java_package = "com.cerence.cloudservices.domain.common.content.news.v1";

message NewsEntity {
  //Identification string for this news entity.
  string id = 1;

  //The headline.
  string headline = 2;

  //A summary. Only for search
  string summary = 3;

  //The complete text. This is only returned for the first news entity in the response.
  string complete_text = 4;

  //The source. DEPRECATED This field is replaced by AttributionDetails
  string source = 5 [deprecated = true];

  //The date this news item was created. The format is: 2020-10-21T03:48:15Z.
  string date_created = 6;

  //The date this news item was last updated. The format is: 2020-10-21T03:48:15Z. Only for search.
  string date_update = 7;

  //The priority for this news item. Only for search.
  string priority = 8;

  //The language used in the news text.
  string language = 9;

  //The geography of the news item. Only for search.
  string geography = 10;

  //The author.
  string author = 11;

  //The URL for any image associated with this news item. Only for search.
  string image_url = 12;

  //A comma-delimited list of categories associated with this news item. Only for search.
  string categories = 13;

  //The location of the news item. Only for details.
  string locations = 14;

  //The audio url of the news item. For audio news providers.
  string audio_url = 15;

  //Describes the source of the news article obtained
  AttributionDetails attribution_details=16;
}

message AttributionDetails{
  //Who is publishing the article that is being returned. This is the organization that creates the article. Sometimes the publisher provides the article, but it's not always the case
  NewsSource publisher = 1;
  //The service from where we retrieve the article was retrieved. Sometimes the publisher provides the article, but it's not always the case
  NewsSource provider = 2;
}

message NewsSource {
  string name = 1;
  string image_url = 2;
}