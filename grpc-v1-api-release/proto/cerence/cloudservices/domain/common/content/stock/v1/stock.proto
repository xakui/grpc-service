syntax = "proto3";

package cerence.cloudservices.domain.common.content.stock.v1;


option go_package = "cerence/cloudservices/domain/common/content/stock/v1";
option java_multiple_files = false;
option java_outer_classname = "StockProto";
option java_package = "com.cerence.cloudservices.domain.common.content.stock.v1";

message StockResponseContent {
  repeated Stock stocks = 1;
}

message Stock {
  // Container for the name, symbol, and market for this stock.
  Security security = 1;

  // The date and time of this quote in the local time of the market contained
  // in the security element. The format is as follows: YYYY-MM-DDThh:mm:ss
  string date_time = 2;

  // The value of this stock when the market opened on this day.
  double open = 3;

  // The value of this stock when the market closed on this day. The value is "0" if the market is open.
  double close = 4;

  // The highest value of the stock on this day.
  double high = 5;

  // The lowest value of the stock on this day.
  double low = 6;

  // The most recent value of the stock.
  double last = 7;

  // The number of shares traded for this stock on this day across all exchanges.
  int64 volume = 8;

  // The change from the price in previousClose to the most current trading price.
  double price_change = 9;

  // The percentage change from the price in previousClose to the most current trading price.
  double percent_change = 10;

  // The price at which the last trade occurred for the stock on the previous trading day.
  double previous_close = 11;

  // The highest value of the stock in the last 52 weeks.
  double fifty_two_weeks_high = 12;

  // The lowest value of the stock in the last 52 weeks.
  double fifty_two_weeks_low = 13;

  // The name of the currency related to these quotes.
  string currency = 14;

  // The value of the stock that has been traded.
  double cash_amount = 15;
}

message Security {
  // The name of the stock.
  string name = 1;

  // The symbol identifier for the security. Commonly referred to as the trading symbol.
  string symbol = 2;

  // The name of the market on which the security is listed.
  string market = 3;

  // The name of the exchange on which the security is listed.
  string exchange_name = 4;
}