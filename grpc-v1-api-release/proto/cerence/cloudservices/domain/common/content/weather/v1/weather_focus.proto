syntax = "proto3";

package cerence.cloudservices.domain.common.content.weather.v1;


import "google/protobuf/wrappers.proto";

option go_package = "cerence/cloudservices/domain/common/content/weather/v1";
option java_multiple_files = true;
option java_outer_classname = "WeatherFocusProto";
option java_package = "com.cerence.cloudservices.domain.common.content.weather.v1";

message WeatherFocus {
  enum STRUCTURE {
    STRUCTURE_UNSPECIFIED = 0;
    STRUCTURE_RESERVED_UNKNOWN = 1;
    STRUCTURE_DAILY_FORECASTS = 2;
    STRUCTURE_DAILY_FORECASTS_DAY = 3;
    STRUCTURE_DAILY_FORECASTS_NIGHT = 4;
    STRUCTURE_HOURLY_FORECASTS = 5;
    STRUCTURE_CURRENT_CONDITIONS = 6;
    STRUCTURE_OUT_OF_RANGE = 7;
  }

  // Describes which object in the response has the information related to
  // the request. 
  // OutOfRange indicates that the content for the specific request time is
  // not available. For example, this response would be received if the
  // query was "what is the weather in ten years".
  STRUCTURE structure = 1;

  // Start index that relates to the request. For example, if the request is
  // "What is the weather tomorrow", the structure is "dailyForecasts",
  //and the value of this key will be "1".
  google.protobuf.Int32Value start_index = 2;

  // End index that relates to the request. For example, if the request is
  // "What is the weather tomorrow", the structure is "dailyForecasts",
  //and the value of this key will be "1". 
  google.protobuf.Int32Value end_index = 3;
}