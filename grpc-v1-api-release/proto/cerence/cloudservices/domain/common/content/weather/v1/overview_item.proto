syntax = "proto3";

package cerence.cloudservices.domain.common.content.weather.v1;

import "cerence/cloudservices/domain/common/content/common/v1/common_detail.proto";
import "cerence/cloudservices/domain/common/content/weather/v1/common_detail.proto";
import "cerence/cloudservices/domain/common/content/weather/v1/weather_location.proto";

option go_package = "cerence/cloudservices/domain/common/content/weather/v1";
option java_multiple_files = true;
option java_outer_classname = "OverviewItemProto";
option java_package = "com.cerence.cloudservices.domain.common.content.weather.v1";

message OverviewItem {
  // The weather icon for this location
  Icon icon = 1;

  // Temperature information, including unit of measurement.
  cerence.cloudservices.domain.common.content.common.v1.Measurement temperature = 2;

  // The details of the location for this overview.
  WeatherLocation location = 3;

  // The direction and speed of the wind
  Wind wind = 4;
}