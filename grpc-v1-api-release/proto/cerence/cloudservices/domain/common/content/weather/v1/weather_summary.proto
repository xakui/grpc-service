syntax = "proto3";

package cerence.cloudservices.domain.common.content.weather.v1;

import "cerence/cloudservices/domain/common/content/common/v1/common_detail.proto";
import "cerence/cloudservices/domain/common/content/common/v1/content_status.proto";
import "cerence/cloudservices/domain/common/content/weather/v1/current_conditions.proto";
import "cerence/cloudservices/domain/common/content/weather/v1/daily_forecast.proto";
import "cerence/cloudservices/domain/common/content/weather/v1/hourly_forecast.proto";
import "cerence/cloudservices/domain/common/content/weather/v1/weather_focus.proto";
import "cerence/cloudservices/domain/common/content/weather/v1/weather_location.proto";

option java_multiple_files = true;
option java_outer_classname = "WeatherSummaryProto";
option java_package = "com.cerence.cloudservices.domain.common.content.weather.v1";
option go_package = "cerence/cloudservices/domain/common/content/weather/v1";

message WeatherSummary {
  WeatherFocus weather_focus = 1;

  WeatherLocation location = 2;

  CurrentConditions current_conditions = 3;

  repeated DailyForecast daily_forecasts = 4;

  repeated HourlyForecast hourly_forecasts = 5;

  repeated cerence.cloudservices.domain.common.content.common.v1.Attribution attributions = 6;

  cerence.cloudservices.domain.common.content.common.v1.ContentStatusInfo content_status_info = 7;
}