syntax = "proto3";

package cerence.cloudservices.domain.common.content.pa.v1;

import "cerence/cloudservices/api/common/v1/personal_assistant_context.proto";

import "google/protobuf/struct.proto";

option go_package = "cerence/cloudservices/domain/common/content/pa/v1";
option java_multiple_files = true;
option java_outer_classname = "PersonalAssistantContentProto";
option java_package = "com.cerence.cloudservices.domain.common.content.pa.v1";

message PersonalAssistantContent {
  string request_id = 1;

  cerence.cloudservices.api.common.v1.PersonalAssistantContext context = 2;

  // For now always pa_provider
  string type = 3;

  ContentInfo content_info = 4;

  string original_response_format = 5;

  string tts_text = 6;

  // Client returning status about actions executed in previous step. Would not be used at the start of a dialog.
  repeated google.protobuf.Struct actions = 7;
}

message ContentInfo {
  string response_format = 1;
}
