syntax = "proto3";

package cerence.cloudservices.domain.common.content.ude.v1;

import "cerence/cloudservices/domain/common/content/common/v1/common_detail.proto";
import "cerence/cloudservices/domain/common/content/ude/v1/meta_info.proto";
import "cerence/cloudservices/domain/common/content/ude/v1/provenance.proto";

import "google/protobuf/wrappers.proto";

option go_package = "cerence/cloudservices/domain/common/content/ude/v1";
option java_multiple_files = true;
option java_outer_classname = "AiDetailProto";
option java_package = "com.cerence.cloudservices.domain.common.content.ude.v1";

// Response from the Reasoning and Knowledge Service
message AiDetail {
  // AI detail version
  string version = 1 [deprecated = true];

  // The name of the restaurant, business, parking or gas station (e.g., "McDonald's (Downtown)").
  AiDetailCommonStringType name = 2 [deprecated = true];

  // The "canonical" name of restaurant, business, parking or gas station (e.g., "McDonald's").
  AiDetailCommonStringType brand_name = 3 [deprecated = true];

  // The "canonical" name of restaurant, business, parking or gas station (e.g., "McDonald's").
  // This field holds the constraints which are applied for similar brands categories. The values
  // are identical to brand_name
  AiDetailCommonStringType similar_brand_name = 4 [deprecated = true];

  // Amenities available at the restaurant, business, parking or gas station.
  AmenityType amenities = 5 [deprecated = true];
  // Amenity attributes
  message AmenityType {
    option deprecated = true;
    // An array of amenity values
    repeated CerenceAmenity values = 1;
    // Confidence and constraints
    MetaInfo meta_info = 2;
    // An array of amenity values, string representation:
    repeated string internal_values = 3;

    // Amenity
    enum CerenceAmenity {
      option deprecated = true;
      // No value has been specified.
      CERENCE_AMENITY_UNSPECIFIED = 0;
      // Used for return value only. Represents value unknown in this version.
      CERENCE_AMENITY_RESERVED_UNKNOWN = 1;

      CERENCE_AMENITY_BIKE_STORAGE_RACK = 2;
      CERENCE_AMENITY_CAR_WASH = 3;
      CERENCE_AMENITY_ELEVATOR = 4;
      CERENCE_AMENITY_CHARGING_STATION = 5;
      CERENCE_AMENITY_GATE = 6;
      CERENCE_AMENITY_LIGHTING_DEVICE = 7;
      CERENCE_AMENITY_TOILET = 8;
      CERENCE_AMENITY_WIFI = 9;
      CERENCE_AMENITY_AIR_PUMP = 10;
      CERENCE_AMENITY_CAR_CAMPING_AREA = 11;
      CERENCE_AMENITY_GROCERY_STORE = 12;
      CERENCE_AMENITY_FOOD = 13;
      CERENCE_AMENITY_FOOD_FOR_HERE = 14;
      CERENCE_AMENITY_SHOWER = 15;
      CERENCE_AMENITY_BABY_CHANGE_ROOM = 16;
      CERENCE_AMENITY_REPAIR_SHOP = 17;
      CERENCE_AMENITY_SELL_ALCOHOL = 18;
      CERENCE_AMENITY_ATM = 19;
      CERENCE_AMENITY_CONVENIENCE_STORE = 20;
      CERENCE_AMENITY_DISCOUNT = 21;
      CERENCE_AMENITY_PARKING = 22;
    }
  }

  // The open status of the restaurant, business, parking or gas station based on either the current
  // time (if the search locus is the current location) or the ETA (if the
  // search locus is the destination or location reference).
  Status status = 6;

  // The open status attributes
  message Status {
    // An array of open status
    repeated StatusType values = 1;

    // An array of open status, string representation
    repeated string internal_values = 3;

    // Confidence and constraints
    MetaInfo meta_info = 2 [deprecated = true];

    // The open status of the restaurant, business, parking or gas station
    enum StatusType {
      // No value has been specified.
      STATUS_TYPE_UNSPECIFIED = 0;
      // Used for return value only. Represents value unknown in this version.
      STATUS_TYPE_RESERVED_UNKNOWN = 1;
      STATUS_TYPE_OPEN = 2;
      STATUS_TYPE_CLOSED = 3;
      STATUS_TYPE_UNAVAILABLE = 4;
    }
  }

  // The price/cost of the restaurant, business, parking or gas station.
  CostType cost = 7 [deprecated = true];
  // Cost attributes
  message CostType {
    option deprecated = true;
    // The 3PP price/cost in provider cost canonicalized.
    CostQualitativeType cost = 1;

    // The normalized price/cost of the restaurant or business
    AiDetailCommonDoubleType normalized_cost = 2;

    // The relative price/cost of the restaurant or business
    AiDetailCommonDoubleType relative_cost = 3;

    // An index to separate parking/gas station by currency
    AiDetailCommonIntegerType internal_currency_bucket_idx = 4;
  }

  // The distance from the restaurant, business, parking or gas station to the search locus.
  DistanceType distance = 8 [deprecated = true];

  // The payment types accepted at the parking option.
  PaymentType payment_type = 9 [deprecated = true];

  // Payment attributes
  message PaymentType {
    option deprecated = true;
    // An array of payment types
    repeated CerencePaymentType values = 1;

    // Confidence and constraints
    MetaInfo meta_info = 2;

    // An array of payment types
    repeated string internal_values = 3;

    // Payment type
    enum CerencePaymentType {
      option deprecated = true;
      // No value has been specified.
      CERENCE_PAYMENT_TYPE_UNSPECIFIED = 0;

      // Used for return value only. Represents value unknown in this version.
      CERENCE_PAYMENT_TYPE_RESERVED_UNKNOWN = 1;

      CERENCE_PAYMENT_TYPE_AMERICAN_EXPRESS = 2;
      CERENCE_PAYMENT_TYPE_BARCLAY = 3;
      CERENCE_PAYMENT_TYPE_BILL = 4;
      CERENCE_PAYMENT_TYPE_CASH = 5;
      CERENCE_PAYMENT_TYPE_COIN = 6;
      CERENCE_PAYMENT_TYPE_CREDIT_CARD = 7;
      CERENCE_PAYMENT_TYPE_DEBIT_CARD = 8;
      CERENCE_PAYMENT_TYPE_DISCOVER = 9;
      CERENCE_PAYMENT_TYPE_MASTER = 10;
      CERENCE_PAYMENT_TYPE_VISA = 11;
      CERENCE_PAYMENT_TYPE_EC_CARD = 12;
      CERENCE_PAYMENT_TYPE_CHARGENOW = 13;
    }
  }

  // Opening hours
  OpeningHoursType opening_hours = 10;
  message OpeningHoursType {
    // Opening time in the HH:MM format
    AiDetailCommonStringType opening_time = 1;

    // Closing time in the HH:MM format
    AiDetailCommonStringType closing_time = 2;

    // Next opening day if a POI is currently closed.
    DayOfWeekType opening_day = 3;
    message DayOfWeekType {
      repeated cerence.cloudservices.domain.common.content.common.v1.DayOfWeek values = 1;
    }
    // Indicate specific conditions re. open status.
    OpeningFlagType flags = 4;
    message OpeningFlagType {
      repeated CerenceOpeningFlagType values = 1;
    }
    enum CerenceOpeningFlagType {
      //No Value has been specified
      CERENCE_OPENING_FLAG_TYPE_UNSPECIFIED = 0;
      // Used for return value only. Represents value unknown in this version.
      CERENCE_OPENING_FLAG_TYPE_UNKNOWN = 1;

      // This POI is closed all day.
      CERENCE_OPENING_FLAG_TYPE_CLOSED_TODAY = 2;
      // This POI is supposed to be open but is currently closed.
      CERENCE_OPENING_FLAG_TYPE_CLOSED_UNEXPECTED = 3;
    }

  }

  //Place meta info
  PlaceMetaInfo meta_info = 11;

  // Point of interest
  PoiType poi = 30 [deprecated = true];

  // Point of interest attributes
  message PoiType {
    option deprecated = true;
    // The ID of the location/POI given by the underlying 3PP (e.g.,
    // "city-hall-san-francisco").
    string poi_id = 1;

    // The full name of the location/POI (e.g., ""San Francisco City Hall, San
    // Franciso, USA"").
    AiDetailCommonStringType name = 2;

    // The alias name of the location/POI if available (e.g., "San Francisco
    // City Hall").
    AiDetailCommonStringType poi_alias = 3;

    // Currently NOT populated.
    AiDetailCommonStringType poi_category = 4;

    // Coordinates
    CoordinatesType poi_coordinates = 5;

    // Address
    AddressType address = 6;

    // Distance
    DistanceType distance = 7;
  }

  // Domains
  oneof domain {
    // Restaurant & business domain
    Localsearch local_search = 50 [deprecated = true];

    // Fuel domain
    Fuel fuel = 70 [deprecated = true];

    // Parking domain
    Parking parking = 90 [deprecated = true];

    // EV charging
    EVCharging ev_charging = 110 [deprecated = true];
  }

  // Local search attributes for business and restaurant domain.
  message Localsearch {
    option deprecated = true;
    // The ID of the restaurant or business given by the underlying 3PP.
    AiDetailCommonStringType pob = 1;

    // The types/categories of the restaurant or business. This field can
    // contain multiple category values. Return values are restaurant and
    // business types from the AI ontology.
    LocalsearchCategoryType category = 2;

    // The types/categories of the restaurant or business. This field holds
    // the constraints which are applied for similar categories. The values
    // are identical to category
    LocalsearchCategoryType similar_category = 7;

