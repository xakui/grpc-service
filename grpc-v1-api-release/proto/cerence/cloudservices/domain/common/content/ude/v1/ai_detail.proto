    message Connector {
      option deprecated = true;
      // Provider for each connectors.
      AiDetailCommonStringType provider = 1;

      // plug types available at the charging station.
      PlugType plug_type = 2;

      // Plug type attributes
      message PlugType {
        option deprecated = true;
        // An array of plug types
        repeated CerencePlugType values = 1;

        MetaInfo meta_info = 2;

        // An array of plug types
        repeated AiDetailCommonStringType internal_values = 3;

        enum CerencePlugType {
          // No value has been specified.
          CERENCE_PLUG_TYPE_UNSPECIFIED = 0;

          // Used for return value only. Represents value unknown in this
          // version.
          CERENCE_PLUG_TYPE_RESERVED_UNKNOWN = 1;
          CERENCE_PLUG_TYPE_HOUSEHOLD = 2;
          CERENCE_PLUG_TYPE_AC_TYP1 = 3;
          CERENCE_PLUG_TYPE_AC_TYP2 = 4;
          CERENCE_PLUG_TYPE_AC_TYP3 = 5;
          CERENCE_PLUG_TYPE_AC_TYP_CN = 6;
          CERENCE_PLUG_TYPE_CHADEMO = 7;
          CERENCE_PLUG_TYPE_DC_COMBO_TYP1 = 8;
          CERENCE_PLUG_TYPE_DC_COMBO_TYP2 = 9;
          CERENCE_PLUG_TYPE_CEE = 10;
          CERENCE_PLUG_TYPE_AC_CHARGER = 11;
          CERENCE_PLUG_TYPE_DC_CHARGER = 12;
        }
      }

      // Total number of connectors for each plug-type.
      AiDetailCommonIntegerType total = 3;

      // Number of connectors currently available for each plug-type.
      AiDetailCommonIntegerType available = 4;
    }
  }

  // String values
  message AiDetailCommonStringType {
    // An array of string values
    repeated string values = 1;

    // Confidence and constraints
    MetaInfo meta_info = 2 [deprecated = true];
  }

  // Double values
  message AiDetailCommonDoubleType {
    // An array of double values
    repeated google.protobuf.DoubleValue values = 1;

    // Confidence and constraints
    MetaInfo meta_info = 2 [deprecated = true];
  }

  // Integer values
  message AiDetailCommonIntegerType {
    // An array of integer values
    repeated google.protobuf.DoubleValue values = 1;

    // Confidence and constraints
    MetaInfo meta_info = 2 [deprecated = true];
  }

  // Coordinates attributes
  message CoordinatesType {
    option deprecated = true;
    // The latitude e.g., "37.8716"
    AiDetailCommonDoubleType latitude = 1;

    // The longitude e.g., "-122.2727"
    AiDetailCommonDoubleType longitude = 2;
  }

  // Address attributes
  message AddressType {
    option deprecated = true;
    // The full address label of the restaurant or business if available (e.g.,
    // "123 Main St, San Francisco, CA").
    AiDetailCommonStringType address_label = 1;

    // The street number of the restaurant or business if available (e.g.,
    // "123").
    AiDetailCommonStringType street_number = 2;

    // The street name of the restaurant or business if available (e.g., "Main
    // St").
    AiDetailCommonStringType street = 3;

    // The district name of the restaurant or business if available (e.g.,
    // "Sunset District").
    AiDetailCommonStringType district_name = 4;

    // The county name of the restaurant or business if available (e.g., "San
    // Francisco County").
    AiDetailCommonStringType county_name = 5;

    // The city name of the restaurant or business if available (e.g., "San
    // Francisco").
    AiDetailCommonStringType city_name = 6;

    // The state/province name or abbreviation of the restaurant or business if
    // available (e.g., "CA").
    AiDetailCommonStringType state_province = 7;

    // The postal code of the restaurant or business if available (e.g.,
    // "94016").
    AiDetailCommonStringType postal_code = 8;

    // The country name of the restaurant or business if available (e.g.,
    // "United States").
    AiDetailCommonStringType country_name = 9;

    // The country code of the restaurant or business if available (e.g., "US").
    AiDetailCommonStringType country_code = 10;
  }

  // Distance attributes
  message DistanceType {
    option deprecated = true;
    // The distance from the restaurant or business to the search locus in
    // either miles or km, depending on datapack configuration and/or market
    // (e.g., "0.5")
    AiDetailCommonDoubleType distance = 1;

    // The detour distance from an active route to the restaurant or business.
    // This field will ONLY be populated for route requests (e.g., "0.75")
    AiDetailCommonDoubleType detour_distance = 2;

    // Unit of measurement
    DistanceUomType distance_uom = 3;

    // Unit of measurement
    message DistanceUomType {
      option deprecated = true;
      // List of unit of measurement
      repeated cerence.cloudservices.domain.common.content.common.v1.UOM values = 1;

      // Confidence and constraints
      MetaInfo meta_info = 2;
    }

    // The ETA from the current location to the Lat/Long of the location/POI.
    // The ETA is provided in HH:MM format where HH is the number of hours and
    // MM is the number of the minutes (e.g., "02:05").
    AiDetailCommonStringType eta = 4;
  }

}

// Meta info included with every field.
message MetaInfo {
  option deprecated = true;
  // Confidence
  double confidence = 1;

  // An array of constraints
  repeated Constraints constraints = 2;

  // Constraints attributes
  message Constraints {
    option deprecated = true;
    bool relaxable = 1;

    bool applied = 2;

    string value = 3;

    // e.g !=, <=
    Operator operator = 4;
  }
}

// Cost qualitative attributes
message CostQualitativeType {
  option deprecated = true;
  // An array of cost qualitatives
  repeated CerenceCostQualitativeType values = 1;

  // Confidence and constraints
  MetaInfo meta_info = 2;

  // An array of cost qualitatives
  repeated string internal_values = 3;

  // Canonicalized cost
  enum CerenceCostQualitativeType {
    option deprecated = true;
    // No value has been specified.
    CERENCE_COST_QUALITATIVE_TYPE_UNSPECIFIED = 0;
    // Used for return value only. Represents value unknown in this version.
    CERENCE_COST_QUALITATIVE_TYPE_RESERVED_UNKNOWN = 1;
    CERENCE_COST_QUALITATIVE_TYPE_CHEAP = 2;
    CERENCE_COST_QUALITATIVE_TYPE_EXPENSIVE = 3;
    CERENCE_COST_QUALITATIVE_TYPE_FREE = 4;
    CERENCE_COST_QUALITATIVE_TYPE_MODERATE = 5;
  }
}
