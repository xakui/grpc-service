syntax = "proto3";

package cerence.cloudservices.api.dialog.v1;

import "cerence/cloudservices/api/common/v1/interaction_history.proto";

import "google/protobuf/struct.proto";

option go_package = "cerence/cloudservices/api/dialog/v1";
option java_multiple_files = true;
option java_outer_classname = "PlugAndPlayDialogStreamingResponseContinuationProto";
option java_package = "com.cerence.cloudservices.api.dialog.v1";

// Deprecated, this message is replaced by the one defined in proto/cerence/cloudservices/domain/results/dialog/v1/domain_results.proto
message PlugAndPlayDialogStreamingResponseContinuation {
  oneof continuation {
    // Interation facet chunk
    FacetChunk facet_chunk = 1 [deprecated = true];

    // After all interactions' facet has been sent back to client, then send back the dialog follow up information
    DialogFollowUp dialog_follow_up = 2 [deprecated = true];
  };

  cerence.cloudservices.api.common.v1.InteractionHistory interaction_history = 3 [deprecated = true];

  bytes session_data = 4 [deprecated = true];
}

// Facet chunk, each chunk shall be incremental.
message FacetChunk {
  // The facet name
  string name = 1;

  // The facet value
  oneof value {
    string string_value = 2;

    bytes bytes_value = 3;

    google.protobuf.Struct struct_value = 4;
  }

  FacetChunkInfo chunk_info = 5;
}

message FacetChunkInfo {
  // Current chunk id in the current interaction
  int32 current = 1;

  // True if this is the last chunk for current interaction
  bool is_last_for_interaction = 2;
}

message DialogFollowUp {
  // Indicates if one of the tasks is in active state.
  // Simple integrations that are only concerned to check if there is an
  // active task to have the mic open for recording may use the Boolean
  // and ignore the tasks[].
  bool has_active_task = 1;
}