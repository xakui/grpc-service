syntax = "proto3";

package cerence.cloudservices.api.services.tts.v1;

import "cerence/cloudservices/api/services/tts/v1/tts_audio_format.proto";
import "cerence/cloudservices/api/services/tts/v1/tts_context.proto";
import "cerence/cloudservices/api/services/tts/v1/tts_marker_type.proto";
import "cerence/cloudservices/api/services/tts/v1/diagnostic.proto";
import "cerence/cloudservices/api/services/tts/v1/tts_input_type.proto";
import "google/protobuf/wrappers.proto";
import "google/rpc/status.proto";

option go_package = "cerence/cloudservices/api/services/tts/v1";
option java_multiple_files = true;
option java_outer_classname = "TtsApiProto";
option java_package = "com.cerence.cloudservices.api.services.tts.v1";

// Service that implements the Cerence API for TTS requests
service TtsQueryService {

  // Performs an TTS query request.
  rpc TtsQuery (TtsQueryRequest) returns (stream StreamingTtsQueryResponse);

  // Performing an streaming TTS query request.
  rpc StreamingTtsQuery (stream StreamingTtsQueryRequest) returns (stream StreamingTtsQueryResponse);
}

message TtsQueryRequest {
  // A string that uniquely identifies the user making the request. The value must not be empty and has a maximum size of 64 characters.
  string user_id = 1;

  // SSML or plain text input content to convert to speech.
  oneof input {
    string text = 2; //Plain text

    string ssml = 3; // SSML
  }

  // Format of the audio that will be generated.
  AudioFormat audio_format = 4;

  // The voice to be used. Correlate this with the language of text input.
  string voice = 5;

  // The genre to be used. This value indicates the custom tuning resources to be used.
  string genre = 6;

  // Specify from a list of marker types enabled in the request. Only available for OGG_OPUS format
  repeated TtsMarkerType marker_types = 7;

  // Set to "true" to enable the delivery of lip sync info (visemes) to the client as part of the phoneme markers
  // JSON object in the response marker_events.
  bool lip_sync_info = 8;

  // The logging information that can be passed in the request.
  Logging logging = 9;

  // Product Improvements
  ProductImprovements product_improvements = 10;

  // The device id allows to differentiate between devices. The value must not be empty and must have a maximum size of 64 characters.
  string device_id = 11;

  // Response Version
  string response_version = 12;

  // Provides context information
  Context  context = 13;
}

// The top-level message sent by the client for the 'StreamingTtsQuery' method.
// Multiple 'StreamingTtsQuery' messages are sent.  The first message must contain a 'request_data'
// message and must not contain 'tts_input'.  All subsequent messages must contain 'tts_input' and must not contain a
// 'request_data' message.
message StreamingTtsQueryRequest {
  oneof streaming_request {
    RequestData request_data = 1;

    // TTS input chunk, the content shall either be text or SSML, based on the input_type specified in the reqeust_data
    // If the input type is SSML, then in each of the tts_input chunk, the SSML tags shall be balanced.
    string tts_input = 2;
  }
}

// Provides information on how to process the request.
message RequestData {
  // A string that uniquely identifies the user making the request. The value must not be empty and has a maximum size of 64 characters.
  string user_id = 1;

  // TTS input type
  TtsInputType input_type = 2;

    // Format of the audio that will be generated.
  AudioFormat audio_format = 3;

  // The voice to be used. Correlate this with the language of text input.
  string voice = 4;

  // The genre to be used. This value indicates the custom tuning resources to be used.
  string genre = 5;

  // Specify from a list of marker types enabled in the request. Only available for OGG_OPUS format
  repeated TtsMarkerType marker_types = 6;

  // Set to "true" to enable the delivery of lip sync info (visemes) to the client as part of the phoneme markers
  // JSON object in the response marker_events.
  bool lip_sync_info = 7;

  // The logging information that can be passed in the request.
  Logging logging = 8;

  // Product Improvements
  ProductImprovements product_improvements = 9;

  // The device id allows to differentiate between devices. The value must not be empty and must have a maximum size of 64 characters.
  string device_id = 10;

  // Response Version
  string response_version = 11;

  // Provides context information
  Context  context = 12;
}

message Logging {
  // Client dialog id. Provide the same value for all requests made within a dialog. Must be a globally unique id.
  string client_dialog_id = 1;

  // Identifies an interaction within a dialog. Must be a valid uuid.
  string client_interaction_uuid = 2;
}

message ProductImprovements {
  // A flag to allow the driver to opt-out from using his or her data for further data model improvements.
  // Default value if not specified is 'true'.
  google.protobuf.BoolValue model_improvements = 1;
}

// The message returned to the client by 'StreamingTtsQueryResponse'
// A series of one or more 'StreamingTtsQueryResponse' messages are streamed back to the client
message StreamingTtsQueryResponse {
  // If set, returns a [google.rpc.Status][google.rpc.Status] message that
  // specifies the status of the current response.

  // google.rpc.Status messages that can be returned:
  // | Code | Message           | Description
  // ----------------------------------------------------------------------------------------
  // | 3    | Invalid Argument  | Invalid request from client.
  // | 7    | PermissionDenied  | Request with invalid subscription.
  // | 13   | Internal          | Error from server or downstream services.
  google.rpc.Status status = 1;

  // The TTS result
  oneof tts_result {

    // Generated TTS audio buffer. Potentially more than one audio buffer will be streamed back.
    AudioElement audio = 2;

    // Generated TTS marker. Potentially more than one marker will be streamed back.
    MarkerElement marker = 3;

    // The metadata information will always be returned last (even for error scenarios).
    Metadata metadata = 4;
  }
}

//Generated tts audio binary and some metadata
message AudioElement {
  // The audio bytes will be encoded as specified in the 'TtsQueryRequest' message 'audio_format' field.
  // Note: as with all bytes fields, proto buffers use a pure binary representation (not base64).
  bytes audio = 1;

  // indicate if this audio element is an ending of an audibe segment.
  bool segment_ending = 2;

  // The generated audio format
  AudioFormat audio_format = 3;
}

//Generated tts Marker event Json format String
message MarkerElement {
  // A TTS result MarkerEvents string in JSON format
  string marker_events = 1;
}

// The metadata information
message Metadata {
  VersionInformation version_info = 1;

  DiagnosticInformation diagnostic_info = 2;
}

// The version information
message VersionInformation {
  // The version stamp of Cerence Cloud
  string cerence_cloud_version = 1;
}
