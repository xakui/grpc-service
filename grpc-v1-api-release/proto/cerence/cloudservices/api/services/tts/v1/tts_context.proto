syntax = "proto3";

package cerence.cloudservices.api.services.tts.v1;

import "google/api/field_behavior.proto";
import "google/type/latlng.proto";

option go_package = "cerence/cloudservices/api/services/tts/v1";
option java_multiple_files = true;
option java_outer_classname = "TtsContextProto";
option java_package = "com.cerence.cloudservices.api.services.tts.v1";

// This message describes the context information that can be passed in TTS requests.
message Context {
  NavigationContext navigation_context = 1;
}

// The context describing the navigation data.
message NavigationContext {
  // The current location of the vehicle
  google.type.LatLng current_location = 1;
}
