syntax = "proto3";

package cerence.cloudservices.api.services.tts.v1;

option go_package = "cerence/cloudservices/api/services/tts/v1";
option java_multiple_files = true;
option java_outer_classname = "TtsInputTypeProto";
option java_package = "com.cerence.cloudservices.api.services.tts.v1";

// TTS input type definition
enum TtsInputType {
  TTS_INPUT_TYPE_UNSPECIFIED = 0; // The input type is unspecified
  TTS_INPUT_TYPE_TEXT = 1; // The input type is text
  TTS_INPUT_TYPE_SSML = 2; // The input type is SSML
}
