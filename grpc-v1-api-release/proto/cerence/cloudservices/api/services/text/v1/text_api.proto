syntax = "proto3";

package cerence.cloudservices.api.services.text.v1;

import "cerence/cloudservices/api/common/v1/concept.proto";
import "cerence/cloudservices/api/common/v1/feature_inventory.proto";
import "cerence/cloudservices/api/common/v1/interaction_history.proto";
import "cerence/cloudservices/api/common/v1/interpretation.proto";
import "cerence/cloudservices/api/common/v1/nlu_result_for_arbitration.proto";
import "cerence/cloudservices/api/common/v1/personal_assistant_request.proto";
import "cerence/cloudservices/api/common/v1/query_status.proto";
import "cerence/cloudservices/api/common/v1/response_config.proto";
import "cerence/cloudservices/api/dialog/v1/pnp_dialog_streaming_response_continuation.proto";
import "cerence/cloudservices/api/dialog/v1/dialog_context.proto";
import "cerence/cloudservices/api/services/text/v1/text_context.proto";
import "cerence/cloudservices/api/services/text/v1/diagnostic.proto";
import "cerence/cloudservices/domain/common/dialog/v1/dialog_interaction.proto";

import "google/rpc/status.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/any.proto";
import "google/protobuf/wrappers.proto";

option go_package = "cerence/cloudservices/api/services/text/v1";
option java_multiple_files = true;
option java_outer_classname = "TextApiProto";
option java_package = "com.cerence.cloudservices.api.services.text.v1";

// Service that implements the Cerence API for TEXT requests
service TextQueryService {

  // Performs a Text query request.
  rpc TextQuery (TextQueryRequest) returns (stream TextQueryResponse);
}

// The top-level message sent by the client for the 'TextQuery' method.
message TextQueryRequest {
  // A string that uniquely identifies the user making the request. The value must not be empty and must have a
  // maximum size of 64 characters.
  string user_id = 1;

  // The text input to be processed by the NLU service
  string input_text = 2 [(google.api.field_behavior) = REQUIRED];

  // Context information
  Context context = 3;

  // User interaction history
  repeated cerence.cloudservices.api.common.v1.InteractionHistory interaction_history = 4;

  // The serialized session state from the previous response.
  // The session data is common across all services
  bytes session_data = 5;

  // Response Version
  string response_version = 6;

  // Dialog data
  Dialog dialog = 7;

  // The logging information that can be passed in the request.
  Logging logging = 8;

  // Personal assistant request data
  cerence.cloudservices.api.common.v1.PersonalAssistantRequest personal_assistant_request = 9;

  // Product Improvements
  ProductImprovements product_improvements = 10;

  // The device id allows to differentiate between devices. The value must not be empty and must have a maximum size of 64 characters.
  string device_id = 11;

  // A list of user data resources to use with the request.
  repeated UserDataResource user_data_resources = 12;

  // Cloud response configuration
  cerence.cloudservices.api.common.v1.ResponseConfig response_config = 13;
}

message Dialog {
  // Object that contains session scoped variables and transaction scoped variables that can
  // be exchanged between client and cloud dialog engine
  cerence.cloudservices.api.dialog.v1.DialogContext context = 1;

  // Used to provide information about client dialog state that may influence the cloud behavior.
  cerence.cloudservices.api.dialog.v1.ClientDialogContext client_dialog_context = 2;
}

message Logging {
  // Client dialog id. Provide the same value for all requests made within a dialog. Must be a globally unique id.
  string client_dialog_id = 1;

  // Identifies an interaction within a dialog. Must be a valid uuid.
  string client_interaction_uuid = 2;
}

message ProductImprovements {
  // A flag to allow the driver to opt-out from using his or her data for further data model improvements.
  // Default value if not specified is 'true'.
  google.protobuf.BoolValue model_improvements = 1;
}

message UserDataResource {
  // The concept identifying the uploaded user data resource.
  cerence.cloudservices.api.common.v1.Concept concept = 1;
}

// The natural language understanding results
message TextQueryResponse {
  // If set, returns a [google.rpc.Status][google.rpc.Status] message that
  // specifies the status of the current response.

  // google.rpc.Status messages that can be returned:
  // | Code | Message              | Description
  // ----------------------------------------------------------------------------------------
  // | 3    | Invalid Argument     | Invalid request from client.
  // | 7    | PermissionDenied     | Request with invalid subscription.
  // | 9    | Failed Precondition  | No geo-coordinates provided.
  // | 13   | Internal             | Error from server or downstream services.
  google.rpc.Status status = 3;

  oneof text_result {
    cerence.cloudservices.api.common.v1.QueryStarted query_started = 5;

    DomainResult domain_result = 1;

    // Deprecated, replaced by 'domain_result_continuation' field.
    cerence.cloudservices.api.dialog.v1.PlugAndPlayDialogStreamingResponseContinuation pnp_dialog_information = 6 [deprecated = true];

    // If domain streaming response feature is enabled, then after domain result and before the metadata, 
    // the cloud will stream back this dialog result continuation, which includes the facet chunks or other info in chunks.
    DomainResultContinuation domain_result_continuation = 7;

    // The metadata information will always be returned last (even for error scenarios).
    Metadata metadata = 2;

    cerence.cloudservices.api.common.v1.NluResultForArbitration nlu_result_for_arbitration = 4 ;
  }
}

message DomainResult {
  // One of the domain results defined in /proto/cerence/cloudservices/domain/results/*.proto
  google.protobuf.Any result = 1;

  cerence.cloudservices.api.common.v1.Interpretations interpretations = 2;

  repeated cerence.cloudservices.api.common.v1.InteractionHistory interaction_history = 3;

  bytes session_data = 4;

  ExtraInfo extra_info = 5;

  repeated cerence.cloudservices.api.common.v1.FeatureInventory features_inventory = 6;
}

message DomainResultContinuation {
  // One of the domain streaming result continuations defined in /proto/cerence/cloudservices/domain/results/*.proto,
  // where the message has a suffix of 'StreamingResponseContinuation'.
  google.protobuf.Any continuation = 1;

  // Optional, the up-to-date latest interaction history slot
  // If it's present, then client shall use it to overwrite the latest interaction history slot in the dialog result.
  cerence.cloudservices.api.common.v1.InteractionHistory interaction_history = 2;

  // Optional, the latest session data 
  // If it's present, then client shall use it as the up-to-date session data.
  bytes session_data = 3;
}

message ExtraInfo {
  // If the user's utterance has been rewritten, then there will be an explanation text.
  cerence.cloudservices.domain.common.dialog.v1.Interaction rewritten_explanation = 1;
}

// The metadata information
message Metadata {
  VersionInformation version_info = 1;

  DiagnosticInformation diagnostic_info = 2;
}

// The version information
message VersionInformation {
  // The version stamp of Cerence Cloud
  string cerence_cloud_version = 1;
}
