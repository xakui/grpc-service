syntax = "proto3";

package cerence.cloudservices.api.services.user_data.v1;


option go_package = "cerence/cloudservices/api/services/user_data/v1";
option java_multiple_files = true;
option java_outer_classname = "InputDataProto";
option java_package = "com.cerence.cloudservices.api.services.user_data.v1";

message DataBlock {
  oneof payload {
    Contacts contacts = 1;

    CustomWords custom_words = 2;
  }
}

message Contacts {
  repeated Contact entries = 1; // Mandatory field
}

message Contact {
  string id = 1; // Mandatory field

  // At least one of the following fields must be non-empty: first_name, first_name_phonetic,
  // last_name, last_name_phonetic, middle_name, full_name, nick_name
  string first_name = 2;  // See note above

  string first_name_phonetic = 3; // See note above

  string last_name = 4; // See note above

  string last_name_phonetic = 5; // See note above

  string middle_name = 6; // See note above

  string full_name = 7; // See note above

  string nick_name = 8; // See note above

  string company_name = 9;

  repeated string providers = 10; // Provider from which this contact comes from

  string relationship = 11;
}

message CustomWords {
  repeated CustomWord entries = 1; // Mandatory field
}

message CustomWord {
  string id = 1; // Mandatory field

  // Field name "title" is to align with nomenclature of language model.
  string title = 2; // Mandatory field
}
