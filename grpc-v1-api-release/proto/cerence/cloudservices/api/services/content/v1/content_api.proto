syntax = "proto3";

package cerence.cloudservices.api.services.content.v1;

import "google/protobuf/wrappers.proto";

import "cerence/cloudservices/api/services/content/v1/diagnostic.proto";
import "cerence/cloudservices/domain/common/dialog/v1/dialog_interaction.proto";

option go_package = "cerence/cloudservices/api/services/content/v1";
option java_multiple_files = true;
option java_outer_classname = "ContentApiProto";
option java_package = "com.cerence.cloudservices.api.services.content.v1";

// Service that implements the Cerence API for Content requests
service ContentService {

  // Performs a Get Content query request.
  rpc GetContent (GetContentRequest) returns (stream GetContentResponse);
}

message GetContentRequest {
  // Use content ID and content type to poll the status
  string content_id = 1;

  ContentType content_type = 2;

  // The logging information that can be passed in the request.
  Logging logging = 3;
}

// The content type
enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0;
  CONTENT_TYPE_IMAGE = 1;
}

message Logging {
  // Client dialog id. Provide the same value for all requests made within a dialog. Must be a globally unique id.
  string client_dialog_id = 1;

  // Identifies an interaction within a dialog. Must be a valid uuid.
  string client_interaction_uuid = 2;
}

message GetContentResponse {

  oneof content_result {
    // Status and content meta info
    ContentHeader content_header = 1;

    // The stream of content data
    ContentChunk content_chunk = 2;

    Metadata metadata = 3;
  }

  // Request status and content meta info
  message  ContentHeader {
    //
    // **********  generic info: **********
    //

    // Application-level status of the Get Content request
    ContentPollingStatusCode code = 1;

    // Localized facets that let the client play/display.
    cerence.cloudservices.domain.common.dialog.v1.Interaction interaction = 2;

    // The content type
    ContentType content_type = 3;

    //
    // **********  content-specific info:  **********
    //
    oneof header {
      ImageHeader image_header = 4;
    }
  }

  // Content data
  message  ContentChunk {
    oneof chunk {
      ImageChunk image_chunk = 1;
    }
  }

  message  ImageHeader {
    // Only support limited format of the image type of MIME_TYPE
    enum ImageSubType{
      IMAGE_SUB_TYPE_UNSPECIFIED = 0;
      // ‘image/gif’
      IMAGE_SUB_TYPE_GIF = 1;
      // 'image/jpeg' (.jpg, .jpeg, .jfif, .pjpeg, .pjp)
      IMAGE_SUB_TYPE_JPEG = 2;
      // 'image/png'
      IMAGE_SUB_TYPE_PNG = 3;
    }

    ImageSubType image_sub_type = 4;
  }

  // Image bytes content
  message ImageChunk {
    google.protobuf.BytesValue content_bytes = 2;
  }

  enum ContentPollingStatusCode {
    CONTENT_POLLING_STATUS_CODE_UNSPECIFIED = 0;
    // Content has been generated. So, the content payload would have value.
    CONTENT_POLLING_STATUS_CODE_GENERATED = 1;
    // Content generation failed. Possible reasons: Content filtering, Fail to complete the DALL-E calling.
    CONTENT_POLLING_STATUS_CODE_GENERATION_FAILED = 2;
    // Content not found. Possible reasons: The content has never be generated, or has been removed as expired.
    CONTENT_POLLING_STATUS_CODE_NOT_FOUND = 3;
  }
}

// The metadata information
message Metadata {
  VersionInformation version_info = 2;

  DiagnosticInformation diagnostic_info = 1;
}

// The version information
message VersionInformation {
  // The version stamp of Cerence Cloud
  string cerence_cloud_version = 1;
}
