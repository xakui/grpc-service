syntax = "proto3";

package cerence.cloudservices.api.services.session.v1;


import "google/rpc/status.proto";

import "cerence/cloudservices/api/services/session/v1/diagnostic.proto";

option go_package = "cerence/cloudservices/api/services/session/v1";
option java_multiple_files = true;
option java_outer_classname = "SessionApiProto";
option java_package = "com.cerence.cloudservices.api.services.session.v1";

// Service that implements the Cerence API for Session requests
service SessionService {

  // Performs a delete session request.
  rpc DeleteSession (DeleteSessionRequest) returns (stream DeleteSessionResponse);
}

// The top-level message sent by the client for the 'DeleteSession' method.
message DeleteSessionRequest {
  oneof payload {
    // Delete a session by session ID
    DeleteBySessionId by_session_id = 1;

    // Delete all sessions for the user ID
    DeleteAll all = 2;
  }
}

message DeleteBySessionId {
  // A string that uniquely identifies the user making the request. The value must not be empty and must have a
  // maximum size of 64 characters.
  string user_id = 1;

  // The device id allows to differentiate between devices. The value must not be empty and must have a maximum size of 64 characters.
  string device_id = 2;

  // Session ID to delete
  string session_id_to_delete = 3;

}

message DeleteAll {
  // A string that uniquely identifies the user making the request. The value must not be empty and must have a
  // maximum size of 64 characters.
  string user_id = 1;

  // The device id allows to differentiate between devices. The value must not be empty and must have a maximum size of 64 characters.
  string device_id = 2;

}

// The message returned to the client by 'DeleteSession'
message DeleteSessionResponse {
  // If set, returns a [google.rpc.Status] message that
  // specifies the status of the current response.

  // google.rpc.Status messages that can be returned:
  // | Code | Message           | Description
  // ----------------------------------------------------------------------------------------
  // | 3    | Invalid Argument  | Invalid request from client.
  // | 7    | PermissionDenied  | Request with invalid subscription.
  // | 13   | Internal          | Error from server or downstream services.
  google.rpc.Status status = 1;

  oneof delete_result {
    Metadata metadata = 2;
  }
}

// The metadata information
message Metadata {
  VersionInformation version_info = 1;

  DiagnosticInformation diagnostic_info = 2;
}

// The version information
message VersionInformation {
  // The version stamp of Cerence Cloud
  string cerence_cloud_version = 1;
}