syntax = "proto3";

package cerence.cloudservices.api.common.v1;

import "cerence/cloudservices/api/common/v1/interpretation.proto";

option go_package = "cerence/cloudservices/api/common/v1";
option java_multiple_files = true;
option java_outer_classname = "NluResultForArbitrationProto";
option java_package = "com.cerence.cloudservices.api.common.v1";

message NluResultForArbitration {
  cerence.cloudservices.api.common.v1.Interpretations interpretations = 1;

  NluIntentSessionData nlu_intent_session_data = 2;

  // true: DomainResult will NOT be sent for this NLU result
  // false: DomainResult will be sent for this NLU result
  bool domain_result_is_suspended = 3;
}

// Reference to session information specific to this intent
message NluIntentSessionData {
  bytes cookie = 1;

  // SimpleIntent literal
  string literal = 2;
}
