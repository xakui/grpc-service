syntax = "proto3";
package cerence.cloudservices.api.common.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";
import "google/type/latlng.proto";
import "google/type/dayofweek.proto";
import "google/type/timeofday.proto";


option go_package = "cerence/cloudservices/api/common/v1";
option java_multiple_files = true;
option java_outer_classname = "StopoverInfoProto";
option java_package = "com.cerence.cloudservices.api.common.v1";

message StopoverInfo {
    RoutePlaceDetail destination = 1; //The place detail information of destination POI.

    repeated RoutePlaceDetail stopovers = 2; // The waypoint POI list which should include charging planner POIs as well. Note: the waypoints should be sorted in order of arrival.
}

message RoutePlaceDetail {

    google.protobuf.StringValue place_id = 1; // Optional. A token generated by the 3rd party broker.

    repeated google.protobuf.StringValue providers = 2; // Optional. Appears in pairs with the place_id

    google.protobuf.StringValue name = 3; // Optional. The name of place.

    google.protobuf.StringValue address = 4; // Optional. The full address of the place.

    google.type.LatLng geo_location = 5; // Optional. The latitude and longitude coordinate of the place.

    PlaceDetail place_detail = 6; // Optional. Additional information about the place.

    google.protobuf.BoolValue is_charging_plan = 7; // Optional. If this POI in charging plan, then TRUE, else FALSE

}

message PlaceDetail {
    google.protobuf.StringValue phone_number = 1; // Optional.

    Rating rating = 2; // Optional. Details of a place's rating.

    repeated OpeningHours opening_hours = 3;

    TimeZone time_zone = 4;//Optional. A place's time zone.

    repeated google.protobuf.StringValue categories = 5; // Optional. The names of the categories.

    google.protobuf.StringValue price = 6; // Optional. The price can have different meanings depending on the type of place.  For example, it may be the average price for a restaurant, the price per day for a hotel, or the ticket price for an attraction.

    repeated Amenity amenities = 7;// Optional. Amenities available at the restaurant, business, parking place, or gas station

    google.protobuf.StringValue wifi = 8; // Optional. Description of Wi-Fi availability, eg: free, unavailable.

    google.protobuf.BoolValue restrooms = 9; //Optional. Indicates whether there are restrooms available.

    google.protobuf.BoolValue reservable = 10; // Optional. Indicates whether that POI is reservable.

    google.protobuf.StringValue reservation_information = 11; // Optional. Useful information for making a reservation, such as a URL or phone number.

    EvChargingDetail ev_charging_detail = 12; // Optional. Details of EV charging information.

    google.protobuf.StringValue misc_detail = 13; // Optional, string or json string
}

message Rating {
    google.protobuf.Int32Value count = 1; // Optional. The number of ratings.

    google.protobuf.DoubleValue average = 2; // Optional. The average rating, normalized to 0-5 scale
}

message OpeningHours {
    google.type.DayOfWeek day_of_week = 1; // day of week

    repeated TimePeriod periods = 2;
}

message TimePeriod {
    google.type.TimeOfDay opening_time = 1;

    google.type.TimeOfDay closing_time = 2;
}

enum Amenity {
    AMENITY_UNSPECIFIED = 0;
    AMENITY_RESERVED_UNKNOWN = 1;
    AMENITY_BIKE_STORAGE_RACK = 2;
    AMENITY_CAR_WASH = 3;
    AMENITY_ELEVATOR = 4;
    AMENITY_CHARGING_STATION = 5;
    AMENITY_GATE = 6;
    AMENITY_LIGHTING_DEVICE = 7;
    AMENITY_TOILET = 8;
    AMENITY_WIFI = 9;
    AMENITY_AIR_PUMP = 10;
    AMENITY_CAR_CAMPING_AREA = 11;
    AMENITY_GROCERY_STORE = 12;
    AMENITY_FOOD = 13;
    AMENITY_FOOD_FOR_HERE = 14;
    AMENITY_SHOWER = 15;
    AMENITY_BABY_CHANGE_ROOM = 16;
    AMENITY_REPAIR_SHOP = 17;
    AMENITY_SELL_ALCOHOL = 18;
    AMENITY_ATM = 19;
    AMENITY_CONVENIENCE_STORE = 20;
    AMENITY_DISCOUNT = 21;
    AMENITY_PARKING = 22;
}

message TimeZone {
    google.protobuf.StringValue name = 1; //The name of time zone, eg: America/Los_Angeles

    // Total offset from UTC to the current local time, expressed as a signed `±HH:MM` string.
    // MUST satisfy: utc_offset = raw_offset + dst_offset,
    // where raw_offset is the standard-time offset (e.g., `-05:00`) and dst_offset
    // is the additional daylight-saving offset (`+01:00` when DST is active, otherwise `+00:00`).
    // Example: America/New_York in summer → raw_offset="-05:00", dst_offset="+01:00", utc_offset="-04:00"
    google.protobuf.StringValue utc_offset = 2;
}

message EvChargingDetail {
    repeated EvChargingConnector connectors = 1; // Container for the details about connectors
}

message EvChargingConnector {
    google.protobuf.StringValue connector_name = 1;

    google.protobuf.StringValue supplier_name = 2;

    repeated google.protobuf.StringValue charging_capacities = 3; // A list of available charge capacity values for the connector, eg: ['500VDC, at max 50A']

    google.protobuf.DoubleValue max_power_level_kw = 4; // The maximum charge power of the connector in kilowatts.

    google.protobuf.BoolValue fixed_cable = 5; // A boolean that indicates if a cable is provided for the connector. If this value is TRUE, there is a cable for the connector at the station.

    google.protobuf.StringValue payment_method_details = 6; // Available payment methods.
}

