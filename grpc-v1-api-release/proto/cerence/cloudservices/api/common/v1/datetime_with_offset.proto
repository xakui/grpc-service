syntax = "proto3";

package cerence.cloudservices.api.common.v1;

import "google/protobuf/duration.proto";

option go_package = "cerence/cloudservices/api/common/v1";
option java_multiple_files = true;
option java_outer_classname = "DateTimeWithOffsetProto";
option java_package = "com.cerence.cloudservices.api.common.v1";

// Represents local time with UTC offset.
message DateTimeWithOffset {
  // Required. Year of date. Must be from 1 to 9999.
  int32 year = 1;

  // Required. Month of year. Must be from 1 to 12.
  int32 month = 2;

  // Required. Day of month. Must be from 1 to 31 and valid for the year and
  // month.
  int32 day = 3;

  // Required. Hours of day in 24 hour format. Should be from 0 to 23.
  int32 hours = 4;

  // Required. Minutes of hour of day. Must be from 0 to 59.
  int32 minutes = 5;

  // Required. Seconds of minutes of the time. Must be from 0 to 59.
  int32 seconds = 6;

  // Optional. Fractions of seconds in nanoseconds. Must be from 0 to
  // 999,999,999.
  int32 nanos = 7;

  // Required. UTC offset. Must be whole seconds, between -18 hours and +18 hours.
  // For example, a UTC offset of -4:00 would be represented as
  // { seconds: -14400 }.
  google.protobuf.Duration utc_offset = 8;
}