syntax = "proto3";

package cerence.cloudservices.api.common.v1;


import "google/protobuf/wrappers.proto";
import "google/protobuf/struct.proto";
import "google/type/latlng.proto";

option go_package = "cerence/cloudservices/api/common/v1";
option java_multiple_files = true;
option java_outer_classname = "ContentItemProto";
option java_package = "com.cerence.cloudservices.api.common.v1";

message ContentItem {
  oneof item {
    ContactItem contact = 1;    // Maps to VoiceActivationMode.VOICE_ACTIVATION_MODE_PHONE_PICKLIST
    MusicItem music = 2;        // Maps to VoiceActivationMode.VOICE_ACTIVATION_MODE_MEDIA_PICKLIST
    PlaceItem place = 3;        // Maps to VoiceActivationMode.VOICE_ACTIVATION_MODE_NAVIGATION_PICKLIST
    GenericItem generic = 4;    // Maps to other picklist enum values defined in VoiceActivationMode
  }
}

message ContactItem {
  string id = 1; // Mandatory field, content item uuid

  // The ordinal number for every item (Such as '1', '2', or 'A', 'B')
  // Optional. Shall only be present if each picklist item has a display ordinal number
  google.protobuf.StringValue ordinal_number = 2;

  // At least one of the following fields must be non-empty: first_name, first_name_phonetic,
  // last_name, last_name_phonetic, middle_name, full_name, nick_name
  string first_name = 3;  // See note above

  string first_name_phonetic = 4; // See note above

  string last_name = 5; // See note above

  string last_name_phonetic = 6; // See note above

  string middle_name = 7; // See note above

  string full_name = 8; // See note above

  string nickname = 9; // See note above

  string additional_info = 10;
}

message MusicItem {
  string id = 1; // Mandatory field, music item uuid

  // The ordinal number for every item (Such as '1', '2', or 'A', 'B')
  // Optional. Shall only be present if each picklist item has a display ordinal number
  google.protobuf.StringValue ordinal_number = 2;

  string title = 3;

  repeated string artists = 4;

  string genre = 5;

  string album = 6;

  string additional_info = 7;
}

message PlaceItem {
  string id = 1; // Mandatory field, uuid

  // The ordinal number for every item (Such as '1', '2', or 'A', 'B')
  // Optional. Shall only be present if each picklist item has a display ordinal number
  google.protobuf.StringValue ordinal_number = 2;

  string name = 3;

  google.type.LatLng geo_position = 4;

  AddressItem address = 5;

  string phone_number = 6;

  // The category canonicals for the place item
  repeated string categories = 8;

  string additional_info = 7;
}

message AddressItem {
  string house_number = 1;

  repeated string streets = 2;

  string postal_code = 3;

  string district = 4;

  string city = 5;

  string state = 6;

  string country = 7;

  // The name of the ward. Applicable to some countries, such as South Korea, Japan
  string ward = 8;
}

message GenericItem {
  string id = 1; // Mandatory field, generic item uuid

  // The ordinal number for every item (Such as '1', '2', or 'A', 'B')
  // Optional. Shall only be present if each picklist item has a display ordinal number
  google.protobuf.StringValue ordinal_number = 2;

  // Item title shown on the screen
  string title = 3;

  string additional_info = 4;
}