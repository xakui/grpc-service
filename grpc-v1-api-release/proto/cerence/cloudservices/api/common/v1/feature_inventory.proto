syntax = "proto3";

package cerence.cloudservices.api.common.v1;

option go_package = "cerence/cloudservices/api/common/v1";
option java_multiple_files = true;
option java_outer_classname = "FeaturesInventoryProto";
option java_package = "com.cerence.cloudservices.api.common.v1";


message FeatureInventory {

    // The pre-defined feature bundle id
    string feature_bundle_id = 1;

    // The features that are contained in the feature bundle id.
    // It is defined as repeated because one feature bundle can have multiple features.
    // The value is the canonical name used in the code, not the human-readable literal name.
    repeated string features = 2;

    int32 remaining_amount_summary = 3;
}