syntax = "proto3";

package cerence.cloudservices.api.common.v1;


import "google/protobuf/struct.proto";

option go_package = "cerence/cloudservices/api/common/v1";
option java_multiple_files = true;
option java_outer_classname = "PersonalAssistantContextProto";
option java_package = "com.cerence.cloudservices.api.common.v1";

message PersonalAssistantContext {
  // Variables in the session scope are preserved across transactions.
  PersonalAssistantSession session = 1;

  // Variables in the transaction scope are only kept for the current transaction.
  google.protobuf.Struct transaction = 2;

  repeated ClientAuth client_auth = 3;
}

message PersonalAssistantSession {
  // A long encoded string representing the state of a dialog/personal assistant service echoed back from the client as multi-turn progress.
  string session = 1;

  string language = 2;

  bool multi_turn_dialog_no_pause = 3;

  bool multi_turn_dialog = 4;

  bool multi_turn_dialog_complete = 5;

  bool multi_turn_dialog_allows_rewind = 6;

  string client_time_stamp = 7;
}

message ClientAuth {
  User user = 1;
}

message User {
  string user_id = 1;

  string user_token = 2;

  string third_party_id = 3;

  string third_party_token = 4;
}
